{% extends "base.html" %}

{% block title %}404 - Page Not Found - DeFi Guardian{% endblock %}

{% block content %}
<section class="error-section d-flex align-items-center justify-content-center min-vh-100">
    <div class="container text-center">
        <div class="error-card p-5">
            <h1 class="display-1 text-accent fw-bold">404</h1>
            <h2 class="mb-4">Page Not Found</h2>
            <p class="lead text-muted mb-5">The verification node you are looking for does not exist or has been moved.</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('index') }}" class="btn btn-primary px-4 py-2">
                    <i class="fas fa-home me-2"></i> Return Home
                </a>
                <a href="{{ url_for('contact') }}" class="btn btn-outline-light px-4 py-2">
                    <i class="fas fa-envelope me-2"></i> Support
                </a>
            </div>
        </div>
    </div>
</section>

<style>
.error-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    max-width: 600px;
    margin: 0 auto;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
}
</style>
{% endblock %}
