{% extends "base.html" %}

{% block title %}Login - DeFi Guardian{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center min-vh-75 align-items-center">
            <div class="col-md-5">
                <div class="auth-card">
                    <div class="auth-header text-center mb-4">
                        <i class="fas fa-shield-halved fa-3x text-accent mb-3"></i>
                        <h2>Welcome Back</h2>
                        <p class="text-muted">Login to access your verification dashboard</p>
                    </div>
                    
                    <form method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember">
                            <label class="form-check-label" for="remember">Remember me</label>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Login</button>
                        </div>
                    </form>
                    
                    <div class="auth-footer text-center mt-4">
                        <p class="mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
                        <a href="#" class="text-muted small">Forgot password?</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
